<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>💌 Carta Digital - Menina da Calça Azul 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
  body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: linear-gradient(135deg, #fce7f3, #e0f2fe);
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Carta */
  .container {
    width: 700px;
    height: 500px;
    padding: 30px 20px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease-in-out;
    opacity: 0;
    transform: translateY(50px);
  }
  .container.show {
    opacity: 1;
    transform: translateY(0);
    transition: transform 1s ease, opacity 1s ease;
  }

  #texto-wrapper {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding-right: 10px;
    scrollbar-width: none;
  }
  #texto-wrapper::-webkit-scrollbar { display: none; }

  #texto {
    font-size: 1.2rem;
    line-height: 1.8;
    white-space: pre-line;
    text-align: left;
    border-right: none;
  }

  .title { text-align: center; font-size: 1.5rem; margin-bottom: 15px; }

  .hearts, .petals {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  .heart, .petal {
    position: absolute;
    font-size: 20px;
    animation: float 6s linear infinite;
  }
  .heart { color: #ff8fa3; }
  .petal { color: #f7c7d9; font-size: 18px; }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .overlay-box {
    background: white;
    padding: 30px 20px;
    border-radius: 15px;
    box-shadow: 0 4px 25px rgba(0,0,0,0.2);
    text-align: center;
    width: 280px;
  }
  .overlay-box input {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    margin-bottom: 12px;
    font-size: 1rem;
    text-align: center;
  }
  .overlay-box button {
    background: #ff8fa3;
    border: none;
    padding: 10px 20px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }
  .overlay-box button:hover { background: #ff5c7a; }

  /* Envelope */
  .envelope-wrapper {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9998;
  }
  .envelope {
    width: 350px;
    height: 250px;
    background: #f8c1c8;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 1s ease, opacity 1s ease;
  }
  .envelope.open {
    transform: rotateX(-90deg) translateY(-200px);
    opacity: 0;
  }

  /* Responsividade */
  @media (max-width: 768px) { .container { width: 90vw; height: 50vh; margin: 2rem; } #texto { font-size: 0.95rem; } .envelope { width: 70%; height: 200px; } }
  @media (max-width: 420px) { .container { width: 90vw; height: 50vh; margin: 1.5rem; } #texto { font-size: 0.9rem; line-height: 1.4; } .envelope { width: 80%; height: 180px; } }
</style>
</head>
<body>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2>Somente a Ádina que eu conheço saberia responder...</h2>
    <p>Sou o apelido que só você entende, e a cor certa nunca esteve na blusa</p>
    <p>Quem eu sou??</p>
    <input type="text" id="userInput" placeholder="Digite sua resposta" />
    <button id="validateBtn">Entrar</button>
  </div>
</div>

<!-- Envelope -->
<div class="envelope-wrapper" id="envelopeWrapper" style="display:none;">
  <div class="envelope" id="envelope">
    <button id="openEnvelope">Abrir Carta</button>
  </div>
</div>

<!-- Carta -->
 <i class="bi bi-download" id="downloadBtn"></i>
<div class="container" id="letterContainer">
  <div id="texto-wrapper">
    <p class="title">💌 Carta digital para menina da calça azul 💌</p>
    <p id="texto"></p>
  </div>
</div>



<div class="hearts" id="hearts"></div>
<div class="petals" id="petals"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const texto = `E lá vamos nós… vou usar toda minha memória pra escrever... (texto completo mantido)`;
let i = 0;
const textoEl = document.getElementById("texto");
const wrapperEl = document.getElementById("texto-wrapper");
let isTyping = true;
wrapperEl.addEventListener('scroll', () => {
  const bottom = wrapperEl.scrollHeight - wrapperEl.scrollTop - wrapperEl.clientHeight;
  isTyping = bottom < 10;
});

function typeWriter() {
  if (i < texto.length && isTyping) {
    textoEl.innerHTML += texto.charAt(i);
    i++;
    wrapperEl.scrollTop = textoEl.scrollHeight;
    setTimeout(typeWriter, 30);
  } else if (i < texto.length && !isTyping) {
    setTimeout(typeWriter, 100);
  }
}

// Overlay
const overlay = document.getElementById("overlay");
const validateBtn = document.getElementById("validateBtn");
const userInput = document.getElementById("userInput");
const envelopeWrapper = document.getElementById("envelopeWrapper");
const envelope = document.getElementById("envelope");
const letterContainer = document.getElementById("letterContainer");
const btn = document.getElementById('downloadBtn');

validateBtn.addEventListener("click", () => {
  if(userInput.value.trim().toLowerCase() === "a menina da calça azul") {
    overlay.style.display = "none";
    envelopeWrapper.style.display = "flex";
  } else {
    alert("Palavra incorreta, tente novamente! 💭");
  }
});
  const element = document.getElementById('texto-wrapper');

  btn.addEventListener('click', () => {
     html2pdf().from(element).set({
    margin: 0.5,
    filename: 'carta-digital.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
  }).save();
  });
// Abrir carta
document.getElementById("openEnvelope").addEventListener("click", () => {
  envelope.classList.add("open");
  setTimeout(() => {
    envelopeWrapper.style.display = "none";
    letterContainer.classList.add("show");
    typeWriter();
    setInterval(createHeart, 500);
    setInterval(createPetal, 700);
  }, 1000);
});

// Corações
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
  heart.innerHTML = "💖";
  document.getElementById("hearts").appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}



// Pétalas
function createPetal() {
  const petal = document.createElement("div");
  petal.classList.add("petal");
  petal.style.left = Math.random() * 100 + "vw";
  petal.style.animationDuration = (Math.random() * 4 + 4) + "s";
  petal.innerHTML = "🌸";
  document.getElementById("petals").appendChild(petal);
  setTimeout(() => petal.remove(), 8000);
}
</script>
</body>
</html>
