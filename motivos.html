<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: linear-gradient(135deg, #fce7f3, #e0f2fe);
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }

  h1 {
    margin-bottom: 2rem;
    text-align: center;
  }

  .cards-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.5rem;
    width: 100%;
    max-width: 1200px;
  }

  .card {
    position: relative;
    background: rgba(255,255,255,0.9);
    border-radius: 15px;
    padding: 1.5rem;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  .card h2 {
    margin-bottom: 1rem;
    font-size: 1.1rem;
  }

  /* Card visto */
  .card.visto {
    opacity: 0.6;
    transform: scale(0.98);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    cursor: default;
  }

  /* Label "Visto" */
  .card.visto::after {
    content: "Visto";
    position: absolute;
    top: 8px;
    right: 8px;
      background: linear-gradient(135deg, #fce7f3, #e0f2fe);
    color: white;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 8px;
  }

  /* Modal */
  .modal {
    position: fixed;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    padding: 1rem;
  }

  .modal-content {
    background: white;
    padding: 2rem;
    border-radius: 15px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  .modal-content p {
    font-size: 1.1rem;
    line-height: 1.6;
    white-space: pre-line;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 1.5rem;
    font-weight: bold;
    color: #ff5c7a;
    cursor: pointer;
  }

  @media (max-width: 1024px) {
    .modal-content { max-width: 80%; padding: 1.5rem; }
  }

  @media (max-width: 600px) {
    .modal-content { padding: 1rem; }
    .card{
      cursor: none;
    }
    .modal-content p { font-size: 1rem; line-height: 1.4; }
    .close-btn { font-size: 1.2rem; top: 8px; right: 10px; }
  }

</style>

const container = document.getElementById('cardsContainer');
const modal = document.getElementById('modal');
const modalText = document.getElementById('modalText');
const closeBtn = document.getElementById('closeBtn');

let vistos = JSON.parse(localStorage.getItem('cardsVistos')) || [];

function showModal(text) {
  modal.style.display = 'flex';
  modalText.textContent = text;
}

motivos.forEach((motivo, index) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${motivo.titulo}</h2>`;
  container.appendChild(card);

  if(vistos.includes(index)) {
    card.classList.add('visto');
  }

  card.addEventListener('click', () => {
    if(!vistos.includes(index)) {
      vistos.push(index);
      localStorage.setItem('cardsVistos', JSON.stringify(vistos));
      card.classList.add('visto');
    }
    showModal(motivo.texto);
  });
});

closeBtn.addEventListener('click', () => {
  modal.style.display = 'none';
});
window.addEventListener('click', (e) => {
  if(e.target === modal){

});
