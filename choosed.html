<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>💌 Carta Digital - Menina da Calça Azul 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Playfair Display', serif;
      background: linear-gradient(135deg, #fce7f3, #e0f2fe);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 700px;
      height: 500px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease-in-out;
    }

    #texto-wrapper {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding-right: 10px;
      scrollbar-width: none; /* Firefox */
    }
    #texto-wrapper::-webkit-scrollbar {
      display: none; /* Chrome, Edge, Safari */
    }

    #texto {
      font-size: 1.2rem;
      line-height: 1.8;
      white-space: pre-line;
      text-align: left;
      border-right: none;
    }

    .title {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .hearts, .petals {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .heart, .petal {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
    }

    .heart { color: #ff8fa3; }
    .petal { color: #f7c7d9; font-size: 18px; }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Responsividade */
    @media (max-width: 768px) { /* tablets menores e grandes smartphones */
      .container {
        width: 90%;
        height: 70%;
        padding: 20px 15px;
      }
      #texto {
        font-size: 1rem;
      }
      .title {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 420px) { /* Samsung A14 e smartphones pequenos */
      .container {
        width: 95%;
        height: 65%;
        padding: 15px 10px;
      }
      #texto {
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .title {
        font-size: 1.2rem;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="texto-wrapper">
      <p class="title">💌 Carta digital para menina da calça azul 💌</p>
      <p id="texto"></p>
    </div>
  </div>

  <div class="hearts" id="hearts"></div>
  <div class="petals" id="petals"></div>

  <script>
  const texto = `E lá vamos nós… vou usar toda minha memória pra escrever e te dedicar essa carta do fundo do coração. Sério, você é muito mais do que eu consigo colocar em palavras. Você é uma das poucas pessoas com quem eu realmente me aproximei, alguém que me fez sentir seguro pra amar e confiar.

Desde a primeira vez que te vi, eu te chamei de "a menina da calça azul" pro Carlos. Você desviava o olhar de um jeito tímido que me encantava demais. Até que, em um dia qualquer, sentei do seu lado e perguntei: “Que horas são?” kkkkk, eu nem imaginava que uma pergunta tão besta ia me deixar curioso pra conhecer cada detalhe seu.

No dia seguinte você não apareceu, e o Carlos comentou que você tinha pegado o mesmo ônibus que ele. Eu fiquei tipo “Ah não, será que eu assustei ela ontem?” fiquei aqui pensando comigo mesmo, “cara, eu fui muito invasivo ou tá tudo bem?” Mas aí você apareceu de novo, linda e radiante, e eu tentei não incomodar… mas, por dentro, morria de vontade de conversar contigo.

Mais tarde, você veio falar comigo e eu fiquei tipo “ela trabalha no Sinduscon?” kkkk, eu nem sabia o que era Sinduscon. Pensei comigo mesmo: "Que diabo é Sinduscon? Aonde fica isso?" Fiz tantas perguntas na minha cabeça que não tive coragem de fazer na hora pra você, mas estava tão feliz que você tinha chegado até mim que tentei me conter com essas emoções. Logo quando cheguei no observatório, fui todo animado dizendo pro Carlos: “Carlos, adivinha quem veio falar comigo hoje?” Ele: “Quem?” Eu: “A menina da calça azul” 😄 Nesse mesmo dia, fui atrás de saber o que era Sinduscon pra, no outro dia, ter algum assunto em comum contigo kkkk.

Lembro como se fosse ontme do nosso primeiro encontro no Food Square. Eu tava nervoso, nunca tinha ido lá e ainda por cima ia sair com você! Mas amei demais e me cultivo aquelas lembraças até hoje. Foi lá que rolou nosso primeiro beijo, e você estava incrível. Conheci mais sobre você, seus gostos, sua família, e você conheceu um pouco sobre mim. Rimos, brincamos, tentamos tirar o urso, mas o que ficou mesmo foram as risadas. Cada detalhe ficou guardado como em um filme de amor, vivendo o nosso próprio “Um Amor de Cinema”. Pensei: “como alguém pode ser tão incrível e nem perceber o quão especial é?” 

Quando você viajou pra Ushuaia, fiquei morrendo de saudades, mas pensei: “calma, é só uma semana”. Mesmo de longe eu queria estar perto, saber se você tava curtindo tudo, segura, aproveitando a natureza que você ama. E lembrei do colar que você tinha visto no Food Square… fui atrás dele como surpresa, guardando como se fosse um tesouro. Porque, sério, cada momento com você é precioso e eu quero lembrar de tudo.

Você é verdadeira Adina, sem filtros, e me sinto sortudo demais de ter te conhecido. Cada dia ao seu lado parece preencher minha própria lista de vida, como nos filmes que a gente ama: “Um Amor de Cinema”. 

Gosto do seu jeito doce, do jeito tímido de perguntar algo, do seu sorriso que ilumina qualquer lugar. Me encanto com você todo dia. Tento fazer tudo que não fizeram por você, porque sei que você merece. Te amo muito, Adina, e dedico essa carta inteirinha a você.`;
    let i = 0;
    const textoEl = document.getElementById("texto");
    const wrapperEl = document.getElementById("texto-wrapper");
    let isTyping = true;

    wrapperEl.addEventListener('scroll', () => {
      const bottom = wrapperEl.scrollHeight - wrapperEl.scrollTop - wrapperEl.clientHeight;
      isTyping = bottom < 10;
    });

    function typeWriter() {
      if (i < texto.length && isTyping) {
        textoEl.innerHTML += texto.charAt(i);
        i++;
        wrapperEl.scrollTop = textoEl.scrollHeight;
        setTimeout(typeWriter, 30);
      } else if (i < texto.length && !isTyping) {
        setTimeout(typeWriter, 100);
      }
    }
    typeWriter();

    // Corações animados
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      heart.innerHTML = "💖";
      document.getElementById("hearts").appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 500);

    // Pétalas animadas
    function createPetal() {
      const petal = document.createElement("div");
      petal.classList.add("petal");
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.animationDuration = (Math.random() * 4 + 4) + "s";
      petal.innerHTML = "🌸";
      document.getElementById("petals").appendChild(petal);
      setTimeout(() => petal.remove(), 8000);
    }
    setInterval(createPetal, 700);
  </script>
</body>
</html>
